<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="icons/icon48.png" width="32" height="32" alt="" />
    <div><h1>Video Downloader Pro</h1><span id="status" class="pill pill-off">Checking…</span></div>
  </header>

  <section id="page">
    <label>Current page</label>
    <div id="title" class="title">…</div>
    <div id="url" class="url">…</div>
  </section>

  <section id="pairing" hidden>
    <label for="code">Pair with the desktop app</label>
    <p class="hint">In the app open <b>Settings → Chrome extension → Pair</b> and type the 6-digit code.</p>
    <div class="row"><input id="code" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="off" /><button id="pairBtn">Pair</button></div>
  </section>

  <div id="message" class="message" hidden></div>

  <footer>
    <button id="sendBtn" class="primary" disabled>Send to Desktop</button>
    <button id="openBtn">Open Downloader</button>
  </footer>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
